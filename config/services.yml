services:
    _defaults:
      autowire: true
      autoconfigure: true
      public: false
    Propel\Bundle\PropelBundle\:
      resource: '../src/*'
      ## Twig\Extension\SyntaxExtension.php is defined in Propel.xml
      exclude: '../src/{Console,Propel,Model,Migrations,Helpers,DependencyInjection,Form,Listener,Validator,Twig/Extension/SyntaxExtension.php,DataCollector,AppBundle.php}'
    ### creating service alias
    Symfony\Component\DependencyInjection\ContainerInterface: '@service_container'